<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Photobook Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        body {
            font-family: 'Georgia', serif;
        }

        .slide {
            transition: transform 0.9s cubic-bezier(.77, 0, .18, 1);
        }
    </style>
</head>

<body class="bg-[#e9e4dd] text-gray-700">

    <header class="fixed top-0 left-0 w-full z-50 bg-black/30 backdrop-blur">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 md:py-5 flex justify-between items-center">

            <a href="index.html" class="heading-font text-white text-lg sm:text-xl md:text-2xl">Story Tree</a>

            <!-- Desktop Nav -->
            <nav
                class="hidden md:flex space-x-6 lg:space-x-8 text-xs lg:text-sm uppercase tracking-widest text-gray-300">
                <a href="stories.html" class="hover:text-white transition-colors duration-200">Stories</a>
                <a href="photobooks.html" class="hover:text-white transition-colors duration-200">Photobooks</a>
                <a href="images.html" class="hover:text-white transition-colors duration-200">Images</a>
                <a href="films.html" class="hover:text-white transition-colors duration-200">Films</a>
                <a href="pre-weddings.html" class="hover:text-white transition-colors duration-200">Pre-Weddings</a>
                <a href="package.html" class="hover:text-white transition-colors duration-200">Package</a>
                <a href="faq.html" class="hover:text-white transition-colors duration-200">FAQ</a>
                <a href="contact.html" class="hover:text-white transition-colors duration-200">Contact</a>
            </nav>

            <!-- Mobile Button -->
            <button id="menuBtn" class="md:hidden text-white text-xl focus:outline-none">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>

        <!-- Mobile Menu -->
        <div id="mobileMenu"
            class="hidden md:hidden bg-black/95 px-6 py-8 space-y-6 text-center text-sm uppercase tracking-widest">
            <a href="stories.html" class="block hover:text-white transition-colors duration-200">Stories</a>
            <a href="photobooks.html" class="block hover:text-white transition-colors duration-200">Photobooks</a>
            <a href="images.html" class="block hover:text-white transition-colors duration-200">Images</a>
            <a href="films.html" class="block hover:text-white transition-colors duration-200">Films</a>
            <a href="pre-weddings.html" class="block hover:text-white transition-colors duration-200">Pre-Weddings</a>
            <a href="package.html" class="block hover:text-white transition-colors duration-200">Package</a>
            <a href="faq.html" class="block hover:text-white transition-colors duration-200">FAQ</a>
            <a href="contact.html" class="block hover:text-white transition-colors duration-200">Contact</a>
        </div>
    </header>

    <script>
        const menuBtn = document.getElementById("menuBtn");
        const mobileMenu = document.getElementById("mobileMenu");

        menuBtn.addEventListener("click", () => {
            mobileMenu.classList.toggle("hidden");
        });

        // Close mobile menu when clicking outside
        document.addEventListener('click', (event) => {
            if (!menuBtn.contains(event.target) && !mobileMenu.contains(event.target)) {
                mobileMenu.classList.add('hidden');
            }
        });
    </script>

    <!-- MAIN CONTENT WITH PROPER PADDING FOR FIXED HEADER -->
    <main class="pt-28 md:pt-32">
        <!-- TOP DIVIDER (to match other pages' structure) -->
        <div class="max-w-5xl mx-auto px-6">
            <div class="border-t border-gray-400 opacity-40"></div>
        </div>

        <!-- COUPLE NAME -->
        <section class="text-center py-12 md:py-14 px-4">
            <h1 class="text-xl tracking-[0.5em] text-gray-600">
                SAKSHI & MALHAR
            </h1>
        </section>

        <!-- DIVIDER (optional but adds consistency) -->
        <div class="max-w-5xl mx-auto px-6 mb-8 md:mb-10">
            <div class="border-t border-gray-400 opacity-40"></div>
        </div>

        <!-- SLIDER -->
        <section class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-10 pb-16 md:pb-20 lg:pb-24">
            <div class="relative overflow-hidden rounded-sm shadow-lg">
                <div id="slider" class="flex slide">
                    <!-- Slides -->
                    <div class="min-w-full">
                        <img src="https://images.unsplash.com/photo-1522673607200-164d1b6ce486"
                            class="w-full h-[60vh] sm:h-[65vh] md:h-[70vh] lg:h-[75vh] object-cover">
                    </div>
                    <div class="min-w-full">
                        <img src="https://images.unsplash.com/photo-1519741497674-611481863552"
                            class="w-full h-[60vh] sm:h-[65vh] md:h-[70vh] lg:h-[75vh] object-cover">
                    </div>
                    <div class="min-w-full">
                        <img src="https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91"
                            class="w-full h-[60vh] sm:h-[65vh] md:h-[70vh] lg:h-[75vh] object-cover">
                    </div>
                    <div class="min-w-full">
                        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330"
                            class="w-full h-[60vh] sm:h-[65vh] md:h-[70vh] lg:h-[75vh] object-cover">
                    </div>
                    <div class="min-w-full">
                        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
                            class="w-full h-[60vh] sm:h-[65vh] md:h-[70vh] lg:h-[75vh] object-cover">
                    </div>
                    <div class="min-w-full">
                        <img src="https://images.unsplash.com/photo-1520854221256-17451cc331bf"
                            class="w-full h-[60vh] sm:h-[65vh] md:h-[70vh] lg:h-[75vh] object-cover">
                    </div>
                    <div class="min-w-full">
                        <img src="https://images.unsplash.com/photo-1529634893366-3f1b7a6b4a12"
                            class="w-full h-[60vh] sm:h-[65vh] md:h-[70vh] lg:h-[75vh] object-cover">
                    </div>
                    <div class="min-w-full">
                        <img src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc"
                            class="w-full h-[60vh] sm:h-[65vh] md:h-[70vh] lg:h-[75vh] object-cover">
                    </div>
                </div>

                <!-- LEFT ARROW -->
                <button onclick="prevSlide()"
                    class="absolute left-4 sm:left-6 top-1/2 -translate-y-1/2 text-white text-3xl sm:text-4xl opacity-60 hover:opacity-100 transition duration-300 bg-black/20 hover:bg-black/30 w-10 h-10 sm:w-12 sm:h-12 rounded-full flex items-center justify-center">
                    &#10094;
                </button>

                <!-- RIGHT ARROW -->
                <button onclick="nextSlide()"
                    class="absolute right-4 sm:right-6 top-1/2 -translate-y-1/2 text-white text-3xl sm:text-4xl opacity-60 hover:opacity-100 transition duration-300 bg-black/20 hover:bg-black/30 w-10 h-10 sm:w-12 sm:h-12 rounded-full flex items-center justify-center">
                    &#10095;
                </button>
            </div>

            <!-- Slide indicators (optional but nice) -->
            <div class="flex justify-center mt-6 space-x-2">
                <span class="text-xs text-gray-500">Swipe or use arrows to navigate</span>
            </div>
        </section>
    </main>

    <script>
        let currentSlide = 0;
        const slider = document.getElementById('slider');
        const totalSlides = slider.children.length;

        function updateSlide() {
            slider.style.transform = `translateX(-${currentSlide * 100}%)`;
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % totalSlides;
            updateSlide();
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
            updateSlide();
        }

        // Auto slide every 5 seconds
        setInterval(nextSlide, 5000);
    </script>

    <!-- FOOTER -->
    <footer class="bg-[#f7f3ef] py-12 sm:py-14 md:py-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 md:px-8">

            <!-- Social Icons -->
            <div class="flex justify-center space-x-6 mb-6 text-gray-700 text-lg">
                <a href="#" aria-label="Instagram" class="hover:text-black transition-colors duration-200">
                    <i class="fa-brands fa-instagram"></i>
                </a>

                <a href="#" aria-label="YouTube" class="hover:text-black transition-colors duration-200">
                    <i class="fa-brands fa-youtube"></i>
                </a>

                <a href="#" aria-label="Facebook" class="hover:text-black transition-colors duration-200">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>
            </div>

            <!-- Copyright -->
            <p class="text-center text-xs sm:text-sm text-gray-600">
                © 2026 Story Tree. All rights reserved.
            </p>

        </div>
    </footer>

</body>

</html>
